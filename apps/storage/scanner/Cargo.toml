[package]
name = "storage-scanner"
version = "0.1.0"
edition = "2021"
description = "Fast macOS disk-usage scanner (getattrlistbulk + rayon) for the Storage app"

[lib]
name = "storage_scanner"
path = "src/lib.rs"

[[bin]]
name = "storage-scanner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
libc = "0.2"
trash = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
