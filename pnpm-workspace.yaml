packages:
  - apps/*
  - packages/*

# pnpm 11+ no longer reads the `pnpm` field of package.json: https://pnpm.io/package_json
overrides:
  "@vercel/routing-utils>path-to-regexp": 6.3.0
  # glob <=14.0.1 has GHSA-3g3m-2fjr-6pw4 and minimatch <11.0.1 has GHSA-g3hv-75wg-m249.
  # @vercel/nft and Expo's CLI and fingerprint (SDK 58, latest) still ask for glob ^13 and
  # minimatch ^10. The patched majors keep the same API and still ship require() exports.
  "glob@13": 14.0.3
  "minimatch@10": 11.0.4

# pnpm 11+ fails the install on unreviewed dependency build scripts: https://pnpm.io/settings/build
# sharp and @biomejs/biome ship prebuilt binaries and have no install scripts.
allowBuilds:
  # Verifies and installs its platform binary.
  esbuild: true
  # Only builds from source when npm_config_build_from_source=true; prebuilt binaries are used.
  "@parcel/watcher": false
  # Prints a funding banner.
  core-js: false
