packages:
  - apps/*
  - packages/*

# pnpm 11+ no longer reads the `pnpm` field of package.json: https://pnpm.io/package_json
overrides:
  "@vercel/routing-utils>path-to-regexp": 6.3.0
  # glob <=14.0.1 has GHSA-3g3m-2fjr-6pw4 (and pulls minimatch <11.0.1, GHSA-g3hv-75wg-m249);
  # @vercel/nft 1.11.0 (latest) still asks for ^13. Traces are identical with 14.
  "@vercel/nft>glob": 14.0.3

# pnpm 11+ fails the install on unreviewed dependency build scripts: https://pnpm.io/settings/build
# sharp and @biomejs/biome ship prebuilt binaries and have no install scripts.
allowBuilds:
  # Verifies and installs its platform binary.
  esbuild: true
  # Only builds from source when npm_config_build_from_source=true; prebuilt binaries are used.
  "@parcel/watcher": false
  # Prints a funding banner.
  core-js: false

# pnpm 11+ waits 24 hours before installing a new release (minimumReleaseAge, a supply-chain
# guard). These exact versions were already in the lockfile when the repo moved to pnpm 12,
# published 2026-11-03 to 2026-11-04; each pin covers one version only, so newer releases of the
# same packages still wait. Safe to delete this list from 2026-11-05 02:00 UTC.
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.19"
  - "@expo/config-plugins@58.0.12"
  - "@expo/config@58.0.11"
  - "@expo/env@2.5.4"
  - "@expo/fingerprint@0.21.9"
  - "@expo/inline-modules@0.2.9"
  - "@expo/local-build-cache-provider@58.0.11"
  - "@expo/log-box@58.0.15"
  - "@expo/metro-config@58.0.21"
  - "@expo/metro-runtime@58.0.17"
  - "@expo/prebuild-config@58.0.19"
  - "@expo/router-server@58.0.21"
  - "@iconify-json/lucide@1.2.151"
  - "@iconify-json/vscode-icons@1.2.96"
  - "@posthog/core@1.63.0"
  - babel-preset-expo@58.0.24
  - d3-hierarchy@3.1.3
  - electron-to-chromium@1.5.475
  - enhanced-resolve@5.26.1
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-linking@58.0.16
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo-router@58.0.30
  - expo-splash-screen@58.0.13
  - expo@58.0.23
  - is-core-module@2.18.0
  - lucide-react@1.67.0
  - nitro-core@0.37.2
  - nitro@3.0.261103-rc
  - node-forge@1.4.3
  - posthog-js@1.445.1
  - react-native-nitro-modules@0.37.2
  - resolve@1.22.14
