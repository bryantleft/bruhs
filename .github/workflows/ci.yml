name: ci

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # One app failing must not hide the results of the others.
      fail-fast: false
      matrix:
        project-filter: [theme, design, www, domains, ai, storage, outside-site, outside, api]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Version comes from `packageManager` in the root package.json. pnpm 12 needs v6.1.0+.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Node 26 (Active LTS) matches the Vercel projects and the `engines` fields.
      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check for ${{ matrix.project-filter }}
        run: pnpm run check:${{ matrix.project-filter }}

  pith-macos:
    # The app icon is an Icon Composer package; compiling it needs Xcode 26's actool.
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Rust scanner for native integration tests
        run: pnpm --filter storage build:scanner
      - name: Check native core and bundled disk UI
        run: pnpm check:pith
      - name: Package local Mac app
        run: pnpm build:pith
      - name: Verify app and bundled executable signatures
        # --deep reaches the code nested in the app: the scanner and Sparkle with its helpers.
        run: codesign --verify --deep --strict --verbose=2 apps/storage/native/.build/Pith.app
