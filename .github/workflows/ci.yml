name: ci

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # One app failing must not hide the results of the others.
      fail-fast: false
      matrix:
        project-filter: [theme, design, www, domains, ai, storage, outside-site, outside, api]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Version comes from `packageManager` in the root package.json. pnpm 12 needs v6.1.0+.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Node 26 (Active LTS) matches the Vercel projects and the `engines` fields.
      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check for ${{ matrix.project-filter }}
        run: pnpm run check:${{ matrix.project-filter }}

  pith-macos:
    # The app icon is an Icon Composer package; compiling it needs Xcode 26's actool.
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install both Mac scanner targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build Rust scanner for native integration tests
        run: pnpm --filter storage build:scanner
      - name: Verify local allocation and saved-index restoration
        run: pnpm --filter storage benchmark:local --out "$RUNNER_TEMP/pith-benchmark.json"
      - name: Keep local scanner measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pith-local-benchmark
          path: ${{ runner.temp }}/pith-benchmark.json
          retention-days: 3
      - name: Check native core and bundled disk UI
        run: pnpm check:pith
      - name: Package local Mac app
        env:
          PITH_ARCH: universal
        run: pnpm build:pith
      - name: Verify app and bundled executable signatures
        # --deep reaches the code nested in the app: the scanner and Sparkle with its helpers.
        run: codesign --verify --deep --strict --verbose=2 apps/storage/native/.build/Pith.app
      - name: Audit native window and text sizes
        run: apps/storage/native/.build/Pith.app/Contents/MacOS/Pith --ui-audit "$RUNNER_TEMP/pith-ui-audit"
      - name: Verify native UI heap stays bounded
        run: apps/storage/native/.build/Pith.app/Contents/MacOS/Pith --memory-test "$RUNNER_TEMP/pith-ui-audit/memory.json"
      - name: Keep native layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pith-ui-audit
          path: ${{ runner.temp }}/pith-ui-audit
          retention-days: 3
      - name: Keep the packaged app for the older macOS jobs
        run: ditto -c -k --keepParent apps/storage/native/.build/Pith.app "$RUNNER_TEMP/Pith.zip"
      - name: Upload the packaged app
        uses: actions/upload-artifact@v7
        with:
          name: pith-app
          path: ${{ runner.temp }}/Pith.zip
          retention-days: 3

  pith-older-macos:
    # Pith runs on macOS 14 and later but is built with Xcode 26, which older macOS can't run. So the app packaged above
    # runs here as people get it, with the scanner's tests built for this system. GitHub no longer runs macOS 14: a
    # job asking for it is refused ("macos-14-arm64-us-default is not supported").
    needs: pith-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download the packaged app
        uses: actions/download-artifact@v8
        with:
          name: pith-app
          path: ${{ runner.temp }}
      - name: Unpack the app
        run: ditto -x -k "$RUNNER_TEMP/Pith.zip" "$RUNNER_TEMP/app"
      - name: Verify runtime architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Test the Rust scanner
        run: cargo test --release --manifest-path apps/storage/scanner/Cargo.toml
      - name: Verify local cleanup and Undo
        run: '"$RUNNER_TEMP/app/Pith.app/Contents/MacOS/Pith" --local-tools-test "$RUNNER_TEMP/local-tools.json"'
      - name: Smoke test the app
        # The README's desktop smoke test: real windows, the bundled scanner and WKWebView, and a live map of a folder
        # of its own, which needs a file of 1 MB or more.
        timeout-minutes: 10
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sub/deeper" "$fixture/other"
          echo hi > "$fixture/readme.txt"
          head -c 2000000 /dev/zero > "$fixture/sub/video.mov"
          head -c 300000 /dev/zero > "$fixture/sub/big.bin"
          "$RUNNER_TEMP/app/Pith.app/Contents/MacOS/Pith" --smoke-test "$fixture" "$RUNNER_TEMP/smoke.json"
      - name: Keep smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pith-smoke-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/smoke.json
            ${{ runner.temp }}/local-tools.json
          retention-days: 3
