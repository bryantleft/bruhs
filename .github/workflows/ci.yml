name: ci

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # One app failing must not hide the results of the others.
      fail-fast: false
      matrix:
        project-filter: [design, www, domains, ai, storage, outside-site, steps, api]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Version comes from `packageManager` in the root package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Node 22 matches the Vercel projects and `apps/outside-site` engines.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check for ${{ matrix.project-filter }}
        run: pnpm run check:${{ matrix.project-filter }}
