name: Pith Intel graphics
run-name: Pith Intel graphics for CI ${{ inputs.source_run }}

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: CI run containing the packaged Pith app to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: macos-26-intel
    steps:
      - name: Checkout the graphics control
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify native Intel host
        run: |
          test "$(uname -m)" = x86_64
          test "$(sysctl -in sysctl.proc_translated)" != 1
          {
            uname -a
            sw_vers
            xcodebuild -version
          } > "$RUNNER_TEMP/host.txt"
          cat "$RUNNER_TEMP/host.txt"
      - name: Download the unchanged CI app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          case "$SOURCE_RUN" in ''|*[!0-9]*) echo 'source_run must be a numeric CI run ID'; exit 1;; esac
          gh run view "$SOURCE_RUN" --json databaseId,headSha,headBranch,event,status,workflowName,jobs > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" > "$RUNNER_TEMP/source-artifacts.json"
          python3 - <<'PY'
          import json, os, pathlib
          work = pathlib.Path(os.environ['RUNNER_TEMP'])
          source = json.loads((work / 'source-run.json').read_text())
          assert source['workflowName'] == 'ci' and source['event'] == 'push', 'Choose a push run of ci.yml.'
          assert source['headBranch'] == 'main' and source['status'] == 'completed', 'Choose a completed main-branch run.'
          assert any(job['name'] == 'pith-macos' and job['conclusion'] == 'success' for job in source['jobs']), 'The app packaging job must have passed.'
          artifacts = json.loads((work / 'source-artifacts.json').read_text())['artifacts']
          matches = [item for item in artifacts if item['name'] == 'pith-app' and not item['expired']]
          assert len(matches) == 1, 'The run must have exactly one unexpired pith-app artifact.'
          artifact = matches[0]
          assert artifact['workflow_run']['id'] == source['databaseId'] and artifact['workflow_run']['head_sha'] == source['headSha'], 'The artifact does not match the source CI run.'
          (work / 'source-artifact.json').write_text(json.dumps(artifact, indent=2) + '\n')
          (work / 'source-artifact-id').write_text(str(artifact['id']))
          print('Verifying the packaged app from', source['headSha'])
          PY
          pith_artifact_id="$(cat "$RUNNER_TEMP/source-artifact-id")"
          gh api "repos/$GH_REPO/actions/artifacts/$pith_artifact_id/zip" > "$RUNNER_TEMP/artifact.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          work = pathlib.Path(os.environ['RUNNER_TEMP'])
          artifact = json.loads((work / 'source-artifact.json').read_text())
          digest = 'sha256:' + hashlib.sha256((work / 'artifact.zip').read_bytes()).hexdigest()
          assert artifact['digest'] == digest, 'The downloaded artifact checksum does not match GitHub.'
          PY
          ditto -x -k "$RUNNER_TEMP/artifact.zip" "$RUNNER_TEMP/package"
          ditto -x -k "$RUNNER_TEMP/package/Pith.zip" "$RUNNER_TEMP/app"
          codesign --verify --deep --strict "$RUNNER_TEMP/app/Pith.app"
          for binary in Pith storage-scanner; do
            xcrun lipo "$RUNNER_TEMP/app/Pith.app/Contents/MacOS/$binary" -verify_arch x86_64
          done
          shasum -a 256 "$RUNNER_TEMP/package/Pith.zip" "$RUNNER_TEMP/app/Pith.app/Contents/MacOS/Pith" > "$RUNNER_TEMP/bundle-sha256.txt"
      - name: Compile the standalone graphics control
        run: |
          xcrun swiftc -parse-as-library -swift-version 6 -warnings-as-errors apps/storage/tests/graphics-control.swift -o "$RUNNER_TEMP/graphics-control"
          xcrun swiftc -parse-as-library -swift-version 6 -warnings-as-errors apps/storage/tests/icon-control.swift -o "$RUNNER_TEMP/icon-control"
      # Native diagnostics reuse the ten-minute deadline from ci.yml's packaged-app smoke gate.
      - name: Verify standalone Canvas rendering
        timeout-minutes: 10
        run: '"$RUNNER_TEMP/graphics-control" "$RUNNER_TEMP/graphics-control.json" > "$RUNNER_TEMP/graphics-control.log" 2>&1'
      - name: Verify the macOS file-icon service
        # One icon request uses Actions' minimum minute deadline. The healthy control in runner-images#14751 is sub-second.
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/icon-control" "$RUNNER_TEMP/icon-control.json" > "$RUNNER_TEMP/icon-control.log" 2>&1 &
          pith_icon_pid=$!
          if ! sample "$pith_icon_pid" 1 -file "$RUNNER_TEMP/icon-control-sample.txt" > "$RUNNER_TEMP/icon-control-sample.log" 2>&1; then
            echo 'The icon probe was unavailable to sample; see the sampler log and icon result.' >> "$RUNNER_TEMP/icon-control-sample.log"
          fi
          wait "$pith_icon_pid"
      - name: Verify local cleanup and Undo
        timeout-minutes: 10
        run: '"$RUNNER_TEMP/app/Pith.app/Contents/MacOS/Pith" --local-tools-test "$RUNNER_TEMP/local-tools.json" > "$RUNNER_TEMP/local-tools.log" 2>&1'
      - name: Smoke test the packaged app
        timeout-minutes: 10
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/sub/deeper" "$fixture/other"
          echo hi > "$fixture/readme.txt"
          head -c 2000000 /dev/zero > "$fixture/sub/video.mov"
          head -c 300000 /dev/zero > "$fixture/sub/big.bin"
          "$RUNNER_TEMP/app/Pith.app/Contents/MacOS/Pith" --smoke-test "$fixture" "$RUNNER_TEMP/smoke.json" > "$RUNNER_TEMP/smoke.log" 2>&1
      - name: Verify bounded UI heap
        timeout-minutes: 10
        run: '"$RUNNER_TEMP/app/Pith.app/Contents/MacOS/Pith" --memory-test "$RUNNER_TEMP/memory.json" > "$RUNNER_TEMP/memory.log" 2>&1'
      - name: Collect system icon-service diagnostics
        if: failure()
        run: |
          launchctl print "gui/$(id -u)/com.apple.iconservices.iconservicesagent" > "$RUNNER_TEMP/icon-service-status.txt" 2>&1 || echo 'Unable to query the icon-service job.' >> "$RUNNER_TEMP/icon-service-status.txt"
          /usr/bin/log show --last 10m --style compact --predicate 'process == "iconservicesagent"' > "$RUNNER_TEMP/icon-service.log" 2>&1 || echo 'Unable to read icon-service events.' >> "$RUNNER_TEMP/icon-service.log"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'icon-service-crashes'
          target.mkdir()
          errors = []
          for folder in [pathlib.Path.home() / 'Library/Logs/DiagnosticReports', pathlib.Path('/Library/Logs/DiagnosticReports')]:
              try:
                  for report in folder.glob('iconservicesagent*.ips'):
                      shutil.copy2(report, target / report.name)
              except OSError as error:
                  errors.append(str(error))
          (target / 'collection-errors.json').write_text(json.dumps(errors, indent=2) + '\n')
          PY
      - name: Keep graphics and app evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pith-intel-graphics
          path: |
            ${{ runner.temp }}/host.txt
            ${{ runner.temp }}/source-run.json
            ${{ runner.temp }}/source-artifact.json
            ${{ runner.temp }}/bundle-sha256.txt
            ${{ runner.temp }}/graphics-control.json
            ${{ runner.temp }}/graphics-control.log
            ${{ runner.temp }}/icon-control.json
            ${{ runner.temp }}/icon-control.log
            ${{ runner.temp }}/icon-control-sample.txt
            ${{ runner.temp }}/icon-control-sample.log
            ${{ runner.temp }}/icon-service-status.txt
            ${{ runner.temp }}/icon-service.log
            ${{ runner.temp }}/icon-service-crashes
            ${{ runner.temp }}/local-tools.json
            ${{ runner.temp }}/local-tools.log
            ${{ runner.temp }}/smoke.json
            ${{ runner.temp }}/smoke.log
            ${{ runner.temp }}/memory.json
            ${{ runner.temp }}/memory.log
          retention-days: 3
